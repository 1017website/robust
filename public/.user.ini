; Lampiran Design Request tidak dibatasi aplikasi, jadi batas PHP dilonggarkan.
; post_max_size = 0 berarti tanpa batas. upload_max_filesize tidak boleh 0
; (0 = tolak semua upload), sehingga dipakai angka yang sangat besar.
upload_max_filesize = 4096M
post_max_size = 0
max_file_uploads = 500
memory_limit = 512M
max_execution_time = 0
max_input_time = -1
